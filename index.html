<title>TheSlap</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3eaff;--sheet:#ffffff;--card:rgba(255,255,255,.84);--cb:rgba(130,70,210,.22);--text:#25104a;--muted:#6f5d96;
  --inp:#ffffff;--nav:rgba(255,255,255,.88);--shade:rgba(40,10,90,.18);
  --pink:#ff2bd6;--cyan:#00c8e6;--lime:#8fd400;--yellow:#ffc800;--orange:#ff8a00;--purple:#8b3dff;--blue:#2f6bff;
  --fh:'Baloo 2','Trebuchet MS',system-ui,sans-serif;--fb:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0620;--sheet:#1a0e36;--card:rgba(255,255,255,.07);--cb:rgba(255,255,255,.15);--text:#ffffff;--muted:#bfb1e3;
    --inp:rgba(255,255,255,.09);--nav:rgba(26,10,56,.84);--shade:rgba(0,0,0,.35);
    --cyan:#00e5ff;--lime:#b6ff00;--yellow:#ffe600;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0620;--sheet:#1a0e36;--card:rgba(255,255,255,.07);--cb:rgba(255,255,255,.15);--text:#ffffff;--muted:#bfb1e3;
  --inp:rgba(255,255,255,.09);--nav:rgba(26,10,56,.84);--shade:rgba(0,0,0,.35);
  --cyan:#00e5ff;--lime:#b6ff00;--yellow:#ffe600;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:var(--fb);color:var(--text);background-color:var(--bg);
  background-image:radial-gradient(900px 520px at 0% -8%,rgba(255,43,214,.34),transparent 62%),radial-gradient(800px 600px at 108% 8%,rgba(0,229,255,.26),transparent 62%),radial-gradient(900px 700px at 50% 118%,rgba(139,61,255,.38),transparent 62%);
  background-attachment:fixed;overflow-x:hidden}
button{font-family:inherit;color:inherit}
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(40px);opacity:.5;animation:float 14s ease-in-out infinite}
.orbs i:nth-child(1){width:220px;height:220px;background:#ff2bd6;left:-60px;top:30%}
.orbs i:nth-child(2){width:260px;height:260px;background:#00e5ff;right:-90px;top:55%;animation-delay:-5s}
.orbs i:nth-child(3){width:200px;height:200px;background:#b6ff00;left:35%;top:-80px;animation-delay:-9s;opacity:.28}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.15)}}
#app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 14px 130px;min-height:100vh}
.boot{display:grid;place-items:center;text-align:center;min-height:80vh;gap:6px}
.boot p{color:var(--muted);font-weight:700}
/* Logo */
.logo{font-family:var(--fh);display:flex;align-items:baseline;gap:4px;transform:rotate(-3deg);filter:drop-shadow(0 0 10px rgba(255,43,214,.6));user-select:none}
.logo span{font-size:15px;font-weight:800;color:var(--cyan);letter-spacing:.05em;text-transform:lowercase}
.logo b{font-size:32px;font-weight:800;line-height:1;letter-spacing:.02em;background:linear-gradient(120deg,#ff2bd6 0%,#ff8a00 45%,#ffe600 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo.big b{font-size:64px}.logo.big span{font-size:26px}
/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 4px;margin:0 -4px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:linear-gradient(var(--bg),transparent)}
.topr{display:flex;gap:8px}
.ib{position:relative;width:42px;height:42px;border-radius:50%;border:2px solid var(--cb);background:var(--card);cursor:pointer;font-size:19px;display:grid;place-items:center;transition:transform .12s}
.ib:active{transform:scale(.9)}.ib.sm{width:34px;height:34px;font-size:15px;border-width:1px}
.ib .dot{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--pink);color:#fff;font:800 11px/20px var(--fh);font-style:normal;text-align:center;padding:0 5px;box-shadow:0 0 12px var(--pink);display:none}
/* Buttons */
.btn{position:relative;isolation:isolate;border:0;cursor:pointer;font:800 15px var(--fh);color:#fff;padding:10px 20px;border-radius:999px;background:linear-gradient(135deg,var(--pink),var(--orange));box-shadow:0 6px 22px rgba(255,43,214,.45),inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .12s,filter .12s;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn::after{content:"";position:absolute;z-index:-1;left:8%;right:8%;top:3px;height:42%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0))}
.btn:active{transform:scale(.94)}.btn:hover{filter:brightness(1.08)}
.btn.cyan{background:linear-gradient(135deg,#00d9ff,#2f6bff);box-shadow:0 6px 22px rgba(0,200,255,.4),inset 0 -3px 0 rgba(0,0,0,.18)}

/* ================= v2: TheSlap-Look ================= */
html{background:#14061f}
body{background-color:#14061f;background-image:
 radial-gradient(520px 380px at 8% 6%,rgba(233,30,140,.55),transparent 65%),
 radial-gradient(480px 360px at 96% 22%,rgba(255,212,0,.32),transparent 65%),
 radial-gradient(560px 420px at 20% 70%,rgba(0,200,255,.26),transparent 65%),
 radial-gradient(600px 460px at 90% 92%,rgba(140,60,255,.45),transparent 65%),
 repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 22px)}
/* Logo */
.logo-slot{display:block;line-height:0;cursor:pointer;user-select:none}
.logo-slot svg,.logo-slot img{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 8px rgba(0,0,0,.45))}
.logo-slot.hdr{width:150px}.logo-slot.big{width:min(330px,82vw);margin:0 auto}
.logo-slot img{max-height:120px;object-fit:contain}
.logo-slot.hdr img{max-height:52px;object-position:left}
/* Splash */
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#5b1d7a 0,#240a3c 55%,#0d0418 100%);overflow:hidden;transition:opacity .55s,transform .55s;cursor:pointer}
#splash.out{opacity:0;transform:scale(1.15);pointer-events:none}
#splash .rays{position:absolute;width:190vmax;height:190vmax;left:50%;top:50%;margin:-95vmax 0 0 -95vmax;background:repeating-conic-gradient(from 0deg,rgba(255,226,80,.2) 0 7deg,transparent 7deg 18deg);animation:spin 18s linear infinite;mask-image:radial-gradient(circle,#000 0,transparent 55%);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%)}
@keyframes spin{to{transform:rotate(360deg)}}
#splash .sl{position:relative;width:min(520px,88vw);animation:logoIn 1s cubic-bezier(.2,1.5,.3,1) both}
@keyframes logoIn{0%{transform:scale(.1) rotate(-25deg);opacity:0}60%{opacity:1}100%{transform:none}}
#splash .hand{transform-box:fill-box;transform-origin:50% 100%;animation:slap 1.3s .55s ease-in-out both}
@keyframes slap{0%{transform:rotate(-55deg) translateX(-26px)}30%{transform:rotate(22deg) translateX(10px)}45%{transform:rotate(-8deg)}70%,100%{transform:none}}
#splash .skip{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:rgba(255,255,255,.55);font-weight:800;font-size:13px;animation:fade 1s 1.2s both}
#splash .flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash .5s .75s both;pointer-events:none}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
/* Quadratische Avatare im Slap-Rahmen */
.av{border-radius:20%;border:3px solid #ff3d8b;box-shadow:0 0 0 1px rgba(255,255,255,.35),0 0 14px color-mix(in srgb,var(--uc) 70%,transparent)}
.av.fill{width:100%;height:auto;aspect-ratio:1/1.05;border:0;border-radius:0;box-shadow:none;font-size:46px;display:grid}
/* Slap-Phone */
.slap{margin:18px 0;animation:pop .35s both}
.slap-shell{position:relative;border-radius:34px;padding:10px;background:linear-gradient(160deg,#6fd0ff 0%,#2a78de 34%,#0f419f 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -5px 12px rgba(0,0,40,.45),0 12px 34px rgba(0,0,0,.55),0 0 0 2px #0a2a6b}
.slap-scr{position:relative;overflow:hidden;border-radius:26px;padding:12px;background:radial-gradient(120% 90% at 25% 0,#4a95e6 0,#1d55a8 55%,#143a7a 100%);box-shadow:inset 0 0 0 2px rgba(0,0,40,.55),inset 0 8px 18px rgba(255,255,255,.12)}
.slap-row{display:flex;gap:10px;align-items:flex-start;position:relative}
.slap-av{flex:none;width:84px}
.slap-av .fr{display:block;width:100%;border:4px solid #ff3d8b;border-bottom:0;border-radius:8px 8px 0 0;overflow:hidden;background:#ff3d8b;padding:0;cursor:pointer;line-height:0}
.upd{display:block;width:100%;border:0;background:#ff3d8b;color:#ffb02e;font:900 13px var(--fb);text-align:center;padding:3px 0 5px;border-radius:0 0 9px 9px;letter-spacing:.03em;text-shadow:0 1px 0 rgba(0,0,0,.25)}
button.upd{cursor:pointer}
.slap-msg{flex:1;min-width:0;background:linear-gradient(#fff 0%,#eaf4ff 62%,#cfe5ff 100%);border:3px solid #ff3d8b;border-radius:12px;padding:8px 10px 10px;color:#14142b;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.msg-h{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.who{font:900 17px/1.15 var(--fb);color:#5a22b8;text-transform:uppercase;word-break:break-word}
.who .rb{vertical-align:middle;text-transform:none}
.handle{font-size:12px;font-weight:800;color:#6b7aa0;margin:1px 0 4px}
.slap-msg .pt{font:900 17px/1.2 var(--fb);color:#14142b;background:none;-webkit-background-clip:initial;background-clip:initial;margin:4px 0 0}
.slap-msg .px{color:#14142b;font:800 16px/1.35 var(--fb);margin:3px 0}
.slap-msg .tag{color:#d0187a}
.slap-msg .media{margin:8px 0 4px;border-radius:10px;border:2px solid #ff3d8b}
.slap-msg .ib.sm{width:28px;height:28px;font-size:13px;background:#fff;border-color:#c9d6ee;flex:none}
.feel{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.fl{font:900 14px var(--fb);color:#ff4a1c;text-transform:uppercase}
.fb{flex:1;min-width:120px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:3px 8px;border-radius:10px;background:linear-gradient(#e9f3ff,#cfe3fb);border:2px solid #b4cdf0;box-shadow:inset 0 2px 4px rgba(0,0,60,.18)}
.ft{font:900 15px var(--fb);color:#6a2cc9;text-transform:uppercase;word-break:break-word}.fe{font-size:21px;line-height:1}
.slap .chips{margin:10px 0 0}
.slap .chip{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.35);color:#fff}
.slap .chip.on{background:rgba(255,61,139,.45);border-color:#ff9fc7}
.slap .acts{border-top:0;margin-top:10px;padding-top:0;gap:6px}
.slap .act{background:linear-gradient(#2a67bd,#0f3a82);border:1px solid rgba(255,255,255,.3);border-radius:14px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.slap .act:hover{background:linear-gradient(#3a7bd6,#16489d)}.slap .act.like.on{color:#ff9fc7}.slap .act.rp.on{color:#c6ff3c}
.slap .pick{background:rgba(255,255,255,.92);border-color:#ff3d8b}
.rpby2{font-size:12.5px;font-weight:800;color:#d8ebff;margin:-2px 0 8px}.rpby2 .lnk{color:#ffe14d}
.slap .confetti i{font-size:18px}
.slap.prof .slap-msg .who{font-size:21px}
.pbadges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sstats{display:flex;justify-content:space-around;margin:12px 0 2px;color:#fff}.sstats div{text-align:center}.sstats b{display:block;font:900 22px var(--fb)}.sstats span{font-size:11px;font-weight:800;text-transform:uppercase;opacity:.85}
.srow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
/* Auth */
.auth{max-width:460px;margin:0 auto;padding:24px 0 50px}
.auth .slap-scr{padding:14px}
.auth .seg{background:rgba(0,0,40,.35);border-color:rgba(255,255,255,.25);margin:0 0 10px}
.auth .seg button{color:#cfe3ff}.auth .lb{color:#d8ebff}
.auth .note{background:rgba(255,255,255,.14);color:#e6f1ff}
.auth .emos button{background:rgba(255,255,255,.9)}
.announce{padding:12px 14px;border-radius:18px;margin:10px 0;background:linear-gradient(120deg,rgba(255,225,77,.95),rgba(255,138,30,.95));color:#3a1a00;font-weight:900;box-shadow:0 0 24px rgba(255,180,0,.5)}
.tgl{display:flex;align-items:center;gap:10px;padding:8px 2px;font-weight:800;cursor:pointer}
.tgl input{width:22px;height:22px;accent-color:#ff2bd6}
.cfgrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
.logoprev{background:rgba(255,255,255,.08);border-radius:16px;padding:10px;margin:6px 0}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin:8px 0}.kv b{display:block;font:800 24px var(--fh)}.kv span{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}
#side{display:none}
.side-card .row{margin-top:8px;cursor:pointer}
/* Desktop */
@media (min-width:1000px){
  #app.shell{max-width:1280px;display:grid;grid-template-columns:240px minmax(0,640px) 340px;grid-template-areas:"top top top" "ro ro ro" "nav main side";column-gap:26px;justify-content:center;padding-bottom:50px}
  #app.shell .top{grid-area:top}#roBar{grid-area:ro}#view{grid-area:main}
  #side{grid-area:side;display:block;align-self:start;position:sticky;top:80px}
  .nav{grid-area:nav;position:sticky;top:84px;left:auto;bottom:auto;transform:none;width:auto;align-self:start;flex-direction:column;align-items:stretch;gap:4px;border-radius:28px;padding:12px}
  .nav button{flex-direction:row;gap:12px;justify-content:flex-start;padding:10px 14px;font-size:16px}
  .nav button em{font-size:16px}.nav button.on{background:rgba(255,43,214,.16)}.nav button.on>span{transform:none}
  .nav .plus{order:-1;width:100%;height:auto;min-width:0;margin:0 0 8px;border-radius:99px;padding:12px;font-size:20px;gap:8px;flex-direction:row;justify-content:center;animation:none;box-shadow:0 6px 22px rgba(255,43,214,.55)}
  .nav .plus::after{content:"Neuer Post";font:800 16px var(--fh)}
  .logo-slot.hdr{width:190px}
  .urow .ui{min-width:220px}
}

.orbs i{display:none}
.orbs::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,rgba(10,4,24,.15),rgba(10,4,24,.72)),linear-gradient(rgba(10,4,24,.25),rgba(10,4,24,.5))}
.i{width:22px;height:22px;fill:currentColor;display:block;flex:none}
.i.o{fill:none;stroke:currentColor;stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round}
/* Header: glänzende blaue Knöpfe wie am Phone */
.top{background:linear-gradient(rgba(14,6,30,.85),rgba(14,6,30,0));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ib{width:44px;height:44px;border:2px solid #0a2a6b;color:#fff;background:radial-gradient(circle at 35% 25%,#9be2ff 0,#3d9bf0 38%,#1654c8 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -4px 8px rgba(0,20,90,.45),0 4px 12px rgba(0,0,0,.5);transition:transform .12s,filter .12s}
.ib:hover{filter:brightness(1.1)}.ib .i{width:21px;height:21px;filter:drop-shadow(0 1px 1px rgba(0,30,100,.6))}
.ib.sm{width:30px;height:30px;border-width:1.5px}.ib.sm .i{width:15px;height:15px}
.slap-msg .ib.sm{background:radial-gradient(circle at 35% 25%,#fff,#dbe7fa);color:#a0243e;border-color:#c0cde6;box-shadow:0 1px 3px rgba(0,0,60,.25)}
.slap-msg .ib.sm .i{filter:none}
.ib .dot{background:linear-gradient(#ff6aa8,#e0197d);border:2px solid #fff;top:-6px;right:-6px;box-shadow:0 2px 8px rgba(224,25,125,.7)}
/* Glas-Karten */
.card{background:linear-gradient(160deg,rgba(52,34,112,.78),rgba(22,12,58,.86));border:1px solid rgba(255,255,255,.14);border-radius:24px;box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.16);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.inp{background:rgba(8,4,26,.55);border:1.5px solid rgba(255,255,255,.18);color:#fff;border-radius:14px}
.inp:focus{border-color:#4cc9ff;box-shadow:0 0 0 4px rgba(76,201,255,.2)}
.inp::placeholder{color:rgba(220,210,255,.5)}
select.inp option{color:#111}
.seg{background:rgba(8,4,26,.6);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
.seg button.on{background:linear-gradient(#ff6aa8,#e0197d);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 14px rgba(224,25,125,.55)}
.h2{font-family:var(--fh);text-shadow:0 2px 12px rgba(0,0,0,.5)}
/* Slap-Phone: Bohnenform, Glanz, Kante */
.slap{margin:20px 0}
.slap-shell{border-radius:var(--bean);padding:12px;background:linear-gradient(165deg,#8be0ff 0%,#3f9cf2 18%,#1d62d6 52%,#0c3a96 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.75),inset 0 -6px 14px rgba(0,16,80,.55),inset 3px 0 6px rgba(255,255,255,.18),0 0 0 2px #072159,0 16px 40px rgba(0,0,0,.6)}
.slap-shell::before{content:"";position:absolute;left:8%;right:8%;top:2px;height:11px;border-radius:99px;background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,0));pointer-events:none}
.slap-scr{border-radius:34px 30px 40px 28px / 30px 36px 30px 38px;padding:14px;background:radial-gradient(130% 100% at 20% 0,#5aa6ee 0,#2262b8 48%,#143c82 100%);box-shadow:inset 0 0 0 2px #06205a,inset 0 10px 22px rgba(255,255,255,.14),inset 0 -10px 24px rgba(0,10,60,.4)}
.slap-scr::before{content:"";position:absolute;inset:0;background:linear-gradient(118deg,rgba(255,255,255,.2) 0,rgba(255,255,255,.04) 30%,rgba(255,255,255,0) 31%);pointer-events:none}
.slap-scr>*{position:relative}
.slap-av .fr{border-color:#ff2f8e;background:#ff2f8e;border-radius:10px 10px 0 0;box-shadow:0 4px 10px rgba(0,0,40,.4)}
.upd{background:linear-gradient(#ff4d9e,#e0197d);color:#ffbf3a;border-radius:0 0 10px 10px;font-size:12.5px;letter-spacing:.06em;box-shadow:0 4px 10px rgba(0,0,40,.4)}
.slap-msg{border-color:#ff2f8e;border-radius:14px;background:linear-gradient(#ffffff 0%,#f0f7ff 55%,#d6e8ff 100%);box-shadow:0 5px 14px rgba(0,0,40,.4),inset 0 -3px 8px rgba(80,140,230,.18)}
.who{letter-spacing:.01em;color:#5b21b6}
.fb{background:linear-gradient(#f2f8ff,#d3e5fb);border-color:#a9c6ec}
.fl{color:#ff4a1c}
.slap .acts{gap:7px;margin-top:12px}
.slap .act{background:linear-gradient(#1d3f86,#0b2358);border:1.5px solid #0a2a6b;border-radius:16px 16px 22px 22px / 16px 16px 26px 26px;color:#bfe3ff;padding:9px 4px;box-shadow:inset 0 1.5px 0 rgba(160,210,255,.45),0 3px 8px rgba(0,0,40,.5)}
.slap .act .ic{display:grid}.slap .act .i{width:21px;height:21px}
.slap .act:hover{filter:brightness(1.18);background:linear-gradient(#27509f,#0e2c6c)}
.slap .act.like.on{color:#ff6aa8}.slap .act.rp.on{color:#b6ff4a}
.slap .chip{border-radius:99px}
/* Navigation: dunkles Glas-Panel mit Icons */
.nav{border-radius:34px 34px 42px 42px / 30px 30px 42px 42px;padding:9px 10px;background:linear-gradient(#17327a,#091a48);border:2px solid #061a4d;box-shadow:inset 0 2px 0 rgba(150,210,255,.45),0 14px 34px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
.nav button{color:#8fb4e6;min-width:62px}
.nav button>span{width:34px;height:34px;border-radius:50%;transition:all .18s}
.nav .i{width:23px;height:23px}
.nav button em{font:800 11px var(--fb);letter-spacing:.02em}
.nav button.on{color:#e8f7ff}
.nav button.on>span{background:radial-gradient(circle at 35% 25%,#b4f0ff,#2fb4f5 55%,#1668d0);color:#fff;box-shadow:0 0 16px rgba(60,190,255,.8),inset 0 1.5px 0 rgba(255,255,255,.75);transform:translateY(-3px)}
.nav .plus{width:60px;height:60px;min-width:60px;margin-top:-30px;background:radial-gradient(circle at 35% 22%,#ff9acb,#e0197d 55%,#a8105b);color:#fff;box-shadow:0 0 0 5px #091a48,0 0 0 7px #061a4d,0 10px 26px rgba(224,25,125,.75),inset 0 2px 0 rgba(255,255,255,.65);animation:none}
.nav .plus .i{width:28px;height:28px}
.nav .av{--s:30px;border-width:2px}
.nav button.on #navAv .av{box-shadow:0 0 0 2px #fff}
/* Glossy Buttons verfeinert */
.btn{border:2px solid rgba(255,255,255,.18);border-bottom-color:rgba(0,0,0,.25);text-shadow:0 1px 2px rgba(0,0,0,.35);background:linear-gradient(#ff6aa8,#e0197d);box-shadow:0 6px 18px rgba(224,25,125,.5),inset 0 -3px 0 rgba(0,0,0,.18)}
.btn.cyan{background:linear-gradient(#5fd0ff,#1667d6);box-shadow:0 6px 18px rgba(30,140,240,.5),inset 0 -3px 0 rgba(0,0,0,.2)}
.btn.ghost{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.22);color:#fff;text-shadow:none}
.btn.on{background:linear-gradient(#6b7aa8,#3a4778);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
/* Sheets & Detail */
.sheet{background:linear-gradient(#241757,#150c3a);border:1px solid rgba(255,255,255,.16);color:#fff}
.sheet .x{background:rgba(255,255,255,.1);color:#fff}
.sheet .slap{margin:8px 0}
.mchip,.emos button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.thumb{background:rgba(255,255,255,.08)}
.teaser{border-radius:99px;padding:10px 16px}
.bdbar{border-radius:20px}
.announce{border-radius:18px;background:linear-gradient(#ffe56a,#ff9d2e);color:#3a1a00;box-shadow:0 8px 22px rgba(255,160,40,.4),inset 0 2px 0 rgba(255,255,255,.6)}
.gcard{border-radius:26px}

async function doForgot() {

    else if (/^[A-Za-z0-9_]{3,20}$/.test(v)) { const s = await col('names').doc(v.toLowerCase()).get(); uid = s.exists ? s.data().uid : null; }
    if (uid) { const m = await col('members').doc(uid).get(); if (m.exists && m.data().status !== 'pending') await col('resets').doc(uid).set({ uid, username: m.data().username || '', at: Date.now() }); }
    toast('Anfrage gesendet ✅ Der Admin meldet sich bei dir mit einem vorläufigen Passwort.'); showAuth('login');
  } catch (e) { fail(e); btn.disabled = false; }
}

async function doLogin() {
  const idv = $('#l-id').value.trim(), pw = $('#l-pw').value;
  if (!idv || !pw) return toast('Bitte E-Mail/Benutzername und Passwort eingeben');
  const btn = $('#authBtn'); btn.disabled = true;
  const bad = () => { throw new Error('E-Mail/Benutzername oder Passwort stimmt nicht.'); };
  try {
    if (!window.crypto || !crypto.subtle) throw new Error('Dein Browser unterstützt die sichere Anmeldung nicht.');
    let uid = null;
    if (idv.includes('@')) { const s = await col('emails').doc(await emailHash(idv)).get(); uid = s.exists ? s.data().uid : null; }
    else if (/^[A-Za-z0-9_]{3,20}$/.test(idv)) { const s = await col('names').doc(idv.toLowerCase()).get(); uid = s.exists ? s.data().uid : null; }
    if (!uid) { await new Promise(r => setTimeout(r, 700)); bad(); }
    const cs = await col('creds').doc(uid).get(); if (!cs.exists) bad();
    const c = cs.data();
    if (await pbkdf(pw, c.salt) !== c.hash) { await new Promise(r => setTimeout(r, 900)); bad(); }
    const ms = await col('members').doc(uid).get();
    if (ms.exists && ms.data().status === 'pending') { toast('Dein Konto wartet noch auf die Freigabe durch den Admin ⏳'); btn.disabled = false; return; }
    const token = rnd(24), sh = await sha(token);
    await col('creds').doc(uid).update({ sessions: [...(c.sessions || []).slice(-4), sh] });
    enterApp(uid, token, sh, c.mustChange);
  } catch (e) { toast(e.message || 'Anmeldung fehlgeschlagen'); btn.disabled = false; }
}
async function ownerReset() {
  const un = $('#o-user').value.trim(), pw = $('#o-pw').value, err = checkPw(pw); if (err) return toast(err);
  try {
    const s = await col('names').doc(un.toLowerCase()).get(); if (!s.exists) return toast('Diesen Benutzernamen gibt es nicht.');

}

async function savePw() {

const BS_FLEET = [5, 4, 3, 3, 2];
const BS_NAMES = ['Schlachtschiff', 'Kreuzer', 'Zerstörer', 'U-Boot', 'Schnellboot'];
function bsCells(x, y, len, o) { const c = []; for (let k = 0; k < len; k++) { const xx = o === 'h' ? x + k : x, yy = o === 'h' ? y : y + k; if (xx > 9 || yy > 9) return null; c.push(yy * 10 + xx); } return c; }
function bsFits(ships, cells, skip) {
  const occ = new Set();
  ships.forEach((s, i) => { if (s && i !== skip) s.forEach(c => { const x = c % 10, y = (c - x) / 10; for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) { const X = x + dx, Y = y + dy; if (X >= 0 && X < 10 && Y >= 0 && Y < 10) occ.add(Y * 10 + X); } }); });
  return cells.every(c => !occ.has(c));
}
function bsRandom() {
  for (let t = 0; t < 300; t++) {
    const ships = []; let ok = true;
    for (let i = 0; i < BS_FLEET.length && ok; i++) {
      ok = false;
      for (let k = 0; k < 300; k++) { const o = Math.random() < .5 ? 'h' : 'v', c = bsCells(Math.floor(Math.random() * 10), Math.floor(Math.random() * 10), BS_FLEET[i], o); if (c && bsFits(ships, c)) { ships[i] = c; ok = true; break; } }
    }
    if (ok) return ships;
  }
  return BS_FLEET.map(() => null);
}

/* ===== Okey (türkisches Rummikub) =====

  }

  /* ---------- Aktionen ---------- */
  const saveRack = () => {

    L.saveT = setTimeout(() => { const r = L.rack ? L.rack.slice() : null, id = L.rackFor; if (!r || !id) return; mref(id).tx(m => { if (!m || !m.st || !m.st.racks || !sameSet(r, m.st.racks[S.uid])) return; m.st.racks[S.uid] = r; return m; }).catch(() => {}); }, 1500);

  async function create(invite, max) {

    const d = { game: gid, status: 'open', host: S.uid, players: [S.uid], max: gid === 'okey' ? (max || L.newMax) : 2, invite: invite || '', createdAt: now, updatedAt: now, turn: 0, winner: '', endBy: '', st: {}, msg: '' };

      }
      case 'start': await T(x => { if (!x || x.status !== 'open' || x.host !== S.uid || x.players.length < 2) return; startMatch(x); x.updatedAt = Date.now(); return x; }); return;
      case 'leave': {
        if (!m) return;

          if (m.host === S.uid) await w(() => mref(m.id).delete());
          else await T(x => { if (!x || x.status !== 'open') return; x.players = x.players.filter(u => u !== S.uid); x.updatedAt = Date.now(); return x; });

        }
        if (!(await ask('Wirklich aufgeben?', 'Aufgeben'))) return;
        const r = await T(x => { if (!x || x.status === 'done') return; const rest = x.players.filter(u => u !== S.uid); x.status = 'done'; x.winner = rest.length === 1 ? rest[0] : ''; x.endBy = S.uid; x.msg = uname(S.uid) + ' hat aufgegeben'; x.updatedAt = Date.now(); return x; });
        if (r && r.winner) addWin(gid, r.winner);
        return;
      }
      case 'rematch': { if (!m) return; const others = m.players.filter(u => u !== S.uid); return create(others.length === 1 ? others[0] : '', m.max); }
      // Schiffe versenken
      case 'pick': L.cur = i; paint(); return;
      case 'rot': L.orient = L.orient === 'h' ? 'v' : 'h'; paint(); return;
      case 'rand': SND.play('draw'); L.ships = bsRandom(); L.cur = 0; paint(); return;
      case 'clear': L.ships = BS_FLEET.map(() => null); L.cur = 0; paint(); return;
      case 'place': { SND.play('tile');

        if (L.ships[L.cur]) { const nx = L.ships.findIndex(s => !s); if (nx < 0) return; L.cur = nx; }
        const c = bsCells(i % 10, Math.floor(i / 10), BS_FLEET[L.cur], L.orient);

      }

          const rk = base && sameSet(base, x.st.racks[S.uid]) ? base.slice() : x.st.racks[S.uid].slice(); while (rk.length < 30) rk.push(null);
          let t;
          if (op === 'draw') { if (!x.st.deck.length) return; t = x.st.deck.pop(); x.msg = uname(S.uid) + ' hat vom Stapel gezogen'; }
          else { const n = x.players.length, pu = x.players[(x.turn - 1 + n) % n], pile = x.st.disc[pu] || []; if (!pile.length) return; t = pile.pop(); x.st.disc[pu] = pile; x.msg = uname(S.uid) + ' hat ' + uname(pu) + 's Stein genommen'; }
          const slot = rk.indexOf(null); rk[slot] = t; x.st.racks[S.uid] = rk; x.st.phase = 'discard'; x.updatedAt = Date.now(); return x;
        });
        L.busy = false; if (r) { L.rack = null; SND.play('draw'); paint(); } return;
      }
      case 'disc': case 'fin': {
        if (L.busy || !m || L.sel < 0 || L.rack[L.sel] === null) return;
        const tile = L.rack[L.sel], base = L.rack.slice(); base[L.sel] = null;
        if (op === 'fin' && !okCheck(base.filter(v => v !== null), m.st.ind)) return toast('Das ist noch kein fertiges Blatt – alle 14 Steine müssen in Reihen/Gruppen oder 7 Paaren liegen.');
        L.busy = true;
        const r = await T(x => {
          if (!x || x.status !== 'play' || x.players[x.turn] !== S.uid || x.st.phase !== 'discard') return;
          const all = x.st.racks[S.uid]; if (!sameSet(base.concat([tile]), all)) return;
          x.st.racks[S.uid] = base; (x.st.disc[S.uid] = x.st.disc[S.uid] || []).push(tile);
          if (op === 'fin') { const kind = okCheck(base.filter(v => v !== null), x.st.ind); if (!kind) return; x.status = 'done'; x.winner = S.uid; x.endBy = S.uid; x.msg = kind === 'pairs' ? 'Mit 7 Paaren beendet! 👯' : 'Blatt komplett!'; }
          else { x.turn = (x.turn + 1) % x.players.length; x.st.phase = 'draw'; x.msg = ''; if (!x.st.deck.length) { x.status = 'done'; x.winner = ''; x.endBy = S.uid; x.msg = 'Keine Steine mehr im Stapel'; } }
          x.updatedAt = Date.now(); return x;
        });
        L.busy = false; L.sel = -1;
        if (r) { L.rack = null; SND.play('tile'); if (r.winner === S.uid) { burst(['🏆', '🀄', '🎉', '✨']); addWin(gid, S.uid); SND.play('win'); } }
        paint(); return;
      }
    }
  }
  return {
    paint, act, mid: () => L.mid,
    setInv(v) { L.newInv = v; },
    destroy() { clearTimeout(L.saveT); SND.music(null); host.innerHTML = ''; }
  };
}

async function saveAccess(uid) {
  const u = S.users[uid]; if (!u) return;
  const email = normEmail($('#ac-email').value), un = $('#ac-user').value.trim(), pw = $('#ac-pw').value;
  if (email && !EMAIL_RE.test(email)) return toast('Bitte eine gültige E-Mail eingeben');
  if (!/^[A-Za-z0-9_]{3,20}$/.test(un)) return toast('Benutzername: 3–20 Zeichen, nur Buchstaben, Zahlen und _');
  if (pw) { const e = checkPw(pw); if (e) return toast(e); }
  const btn = $('#acBtn'); btn.disabled = true;
  try {
    const cs = await col('creds').doc(uid).get(); if (!cs.exists) throw new Error('Konto nicht gefunden');
    const c = cs.data(), changed = [];
    if (email) {
      const eh = await emailHash(email);
      if (eh !== c.eh) {
        if (!(await claim('emails', eh, uid))) { toast('Mit dieser E-Mail gibt es schon ein Konto'); btn.disabled = false; return; }
        if (c.eh) await release('emails', c.eh, uid);
        await col('creds').doc(uid).update({ eh }); await col('members').doc(uid).update({ emailMask: maskEmail(email) }); changed.push('E-Mail');
      }

      await release('names', u.username.toLowerCase(), uid);
      await col('members').doc(uid).update({ username: un }); await col('creds').doc(uid).update({ username: un }); changed.push('Benutzername');
    } else if (un !== u.username) { await col('members').doc(uid).update({ username: un }); changed.push('Benutzername'); }
    if (pw) { await setPassword(uid, pw, true, null); col('resets').doc(uid).delete().catch(() => {}); changed.push('vorläufiges Passwort'); }
    closeSheet(); toast(changed.length ? 'Geändert: ' + changed.join(', ') + ' ✅' : 'Nichts geändert');
  } catch (e) { fail(e); btn.disabled = false; }
}

    case 'no': closeSheet(); break;
    case 'mood': { const i = +t.dataset.i; S.C.mood = S.C.mood === i ? null : i; $$('.mchip').forEach((b, k) => b.classList.toggle('on', S.C.mood === k)); break; }
    case 'rmmedia': { const m = S.C.media.splice(+t.dataset.i, 1)[0]; if (m && m.m) deleteMedia(m.m).catch(() => {}); paintCMedia(); break; }
    case 'playvid': playVideo(t); break;
    case 'notifon': if (typeof Notification !== 'undefined') Notification.requestPermission().then(() => { render(true); updateAppBadge(); }); break;
    case 'access': openAccessSheet(id); break;
    case 'saveaccess': saveAccess(id); break;
    case 'genpw3': $('#ac-pw').value = genPw(); break;
    case 'send': sendPost(); break;
    case 'mg': if (S.gameInst && S.gameInst.act) S.gameInst.act(t.dataset); break;
    case 'sndtoggle': { const on = SND.mute(); t.textContent = on ? '🔊' : '🔇'; toast(on ? '🔊 Ton an' : '🔇 Ton aus'); if (on && S.gameInst && S.gameInst.mid) SND.music(S.gameId); break; }
    case 'fframe': S.F.frame = t.dataset.c; $('#f-frame').value = S.F.frame; $$('.fsw').forEach(b => b.classList.toggle('on', b.dataset.c === S.F.frame)); paintFPrev(); break;
    case 'emogrid': { const g = $('#c-emogrid'); if (g) g.hidden = !g.hidden; break; }
    case 'pickemo': { const i = $('#c-emoji'); if (i) { i.value = t.dataset.e; $('#c-emo-btn').textContent = t.dataset.e; } const g = $('#c-emogrid'); if (g) g.hidden = true; break; }
    case 'mpick': mentionInsert(t.dataset.u); break;
    case 'fcolor': S.F.color = t.dataset.c; $('#f-color').value = S.F.color; $$('.sw').forEach(b => b.classList.toggle('on', b.dataset.c === S.F.color)); paintFPrev(); break;
    case 'femoji': S.F.emoji = t.dataset.e; S.F.avatar = ''; $$('.emos button').forEach(b => b.classList.toggle('on', b.dataset.e === S.F.emoji)); paintFPrev(); break;
    case 'fnophoto': S.F.avatar = ''; S.F.orig = ''; paintFPrev(); break;
    case 'fcrop': { const src = S.F.orig || S.F.avatar; if (!src) { toast('Wähle zuerst ein Foto 📸'); break; } openCropper(src, r => { S.F.avatar = r; paintFPrev(); }); break; }
    case 'newsadd': openNewsForm(); break;
    case 'newscat': S.newsCat = t.dataset.c; render(true); break;
    case 'sendnews': sendNews(); break;
    case 'delnews': if (await ask('Diesen Artikel entfernen?', 'Entfernen')) await w(() => col('news').doc(id).delete()); break;
    case 'editprofile': openEditProfile(id); break;
    case 'saveprofile': saveProfile(id); break;
    case 'authtab': showAuth(t.dataset.m); break;
    case 'login': doLogin(); break;
    case 'register': doRegister(); break;
    case 'ownerreset': ownerReset(); break;
    case 'logout': logout(); break;
    case 'reload': location.reload(); break;
    case 'pwsheet': openPwSheet(false); break;
    case 'savepw': savePw(); break;
    case 'ainvite': adminCreate(); break;
    case 'genpw': $('#i-pw').value = genPw(); break;
    case 'genpw2': $('#a-pw').value = genPw(); break;
    case 'apw': openAdminPw(id); break;
    case 'savepwadmin': { const pw = $('#a-pw').value, err = checkPw(pw); if (err) return toast(err); if (await w(() => setPassword(id, pw, true, null))) { col('resets').doc(id).delete().catch(() => {}); closeSheet(); toast('Vorläufiges Passwort gesetzt 🔑 – gib es der Person weiter'); } break; }
    case 'aban': case 'adel': case 'approve': case 'reject': adminAction(a, id); break;
    case 'sendforgot': doForgot(); break;
    case 'rdismiss': w(() => col('resets').doc(id).delete()); break;
    case 'logoreset': saveCfg({ logoId: '' }); break;
    case 'resetscores': if (await ask('Alle Highscores von ' + GAMES[id].name + ' löschen?', 'Zurücksetzen')) await w(async () => { for (const s of S.scores.filter(s => s.game === id)) await col('scores').doc(s.id).delete(); toast('Zurückgesetzt 🏁'); }); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if ((t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && /^(text|search|email|password|url|tel|number|)$/.test(t.type || ''))) && !t.id.startsWith('snd')) SND.key(/^delete/.test(e.inputType || '') ? 'del' : e.data === ' ' ? 'space' : 'key');
  if (t.id === 'q') { S.q = t.value; const l = $('#plist'); if (l) l.innerHTML = peopleList(); }
  else if (t.id === 'f-color') { S.F.color = t.value; $$('.sw').forEach(b => b.classList.remove('on')); paintFPrev(); }
  else if (t.id === 'f-user') paintFPrev();
  else if (t.id === 'f-frame') { S.F.frame = t.value; $$('.fsw').forEach(b => b.classList.remove('on')); paintFPrev(); }
  else if (t.id === 'c-emoji') { const b = $('#c-emo-btn'); if (b) b.textContent = firstEmoji(t.value) || '➕'; }
  if (t.id === 'c-text' || t.id === 'cm-text') mentionSuggest(t);
  else if (t.id === 'p-new' || t.id === 'p-new2') { const h = $('#p-hint'), a = $('#p-new').value, b = $('#p-new2').value; if (h) h.innerHTML = !b ? '' : a === b ? '<span style="color:#7dffa6">✅ Die Passwörter stimmen überein</span>' : '<span style="color:#ff8aa0">❌ Die Passwörter sind nicht gleich</span>'; }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'f-photo' && t.files[0]) { try { const data = await blobToData(await shrink(t.files[0], 1000, .88)); S.F.orig = data; openCropper(data, r => { S.F.avatar = r; $$('.emos button').forEach(b => b.classList.remove('on')); paintFPrev(); }); } catch (_) { toast('Das Bild konnte nicht gelesen werden.'); } t.value = ''; }
  else if (t.id === 'n-img' && t.files[0]) { try { let max = 640, q = .66, d; do { d = await blobToData(await shrink(t.files[0], max, q)); max -= 90; q -= .05; } while (d.length > 90000 && max > 240); S.N.img = d; const pv = $('#n-prev'); if (pv) pv.innerHTML = '<img alt="" src="' + esc(d) + '" style="height:54px;border-radius:10px">'; } catch (_) { toast('Das Bild konnte nicht gelesen werden.'); } t.value = ''; }
  else if (t.id === 'c-img') { await pickFiles([...t.files], false); t.value = ''; }
  else if (t.id === 'c-vid') { await pickFiles([...t.files], true); t.value = ''; }
  else if (t.id === 'cfg-logo' && t.files[0]) {
    if (!S.assets) { toast('Dafür brauchst du Upload-Rechte.'); return; }
    try { const b = await shrink(t.files[0], 900, 1, 'image/png'), r = await S.assets.upload(b); await saveCfg({ logoId: r.id }); } catch (err) { console.error(err); toast('Logo-Upload fehlgeschlagen'); }
    t.value = '';
  }
  else if (t.id === 'snd-keys' || t.id === 'snd-fx' || t.id === 'snd-music') { SND.set(t.id.slice(4), t.checked); if (t.checked) SND.play('tap'); }
  else if (t.id === 'snd-vol') { SND.set('vol', +t.value); SND.play('coin'); }
  else if (t.id === 'mg-inv') { if (S.gameInst && S.gameInst.setInv) S.gameInst.setInv(t.value); }
  else if (t.dataset.change === 'role') w(() => col('members').doc(t.dataset.id).update({ role: t.value }));
  else if (t.dataset.cfg) {
    const v = t.type === 'checkbox' ? t.checked : t.type === 'number' ? Math.max(+t.min || 0, Math.min(+t.max || 1e9, +t.value || +t.min || 0)) : t.value;
    const path = t.dataset.cfg.split('.'), patch = {}; let o = patch;
    path.forEach((k, i) => { if (i === path.length - 1) o[k] = v; else o = o[k] = {}; });
    saveCfg(patch);
  }
});
document.addEventListener('keydown', e => {
  const id = e.target.id;
  if ((id === 'cm-text' || id === 'c-text') && S.mbox && S.mbox.list.length && (e.key === 'Enter' || e.key === 'Tab')) { e.preventDefault(); mentionInsert(S.mbox.list[0].username); }
  else if (e.key === 'Enter' && id === 'cm-text') { e.preventDefault(); sendComment(); }
  else if (e.key === 'Enter' && id === 'mg-chat-in') { e.preventDefault(); if (S.gameInst && S.gameInst.act) S.gameInst.act({ op: 'chat' }); }
  else if (e.key === 'Enter' && (id === 'l-id' || id === 'l-pw')) { e.preventDefault(); doLogin(); }
  else if (e.key === 'Enter' && id === 'fg-id') { e.preventDefault(); doForgot(); }
  else if (e.key === 'Escape' && S.sheetEl && !S.mustChange) closeSheet();
});
$('#splash') && $('#splash').addEventListener('click', () => { splashEnd = 0; const sp = $('#splash'); if (sp) { sp.dataset.done = 1; sp.classList.add('out'); setTimeout(() => sp.remove(), 700); } });

/* ---------- Start ---------- */
async function boot() {
  splashEnd = Date.now() + 3200; SND.splash();
  $('#splash .sl').innerHTML = logoSvg(DEF.tagline);
  setTimeout(() => { if (!S.cfgLoaded) { S.cfgLoaded = true; endSplash(); } }, 4500);
  const C = window.claude;
  if (!C || !C.use) return gate('Dein Browser unterstützt diese App nicht.');
  let db, user, assets;
  try { [db, user, assets] = await Promise.all([C.use('db'), C.use('user'), C.use('assets')]); } catch (e) { console.error(e); return gate(e && e.code === 'permission-denied' ? 'Die Online-Datenbank ist noch nicht freigegeben (Firestore-Regeln).' : 'Die Online-Datenbank ist gerade nicht erreichbar.'); }
  if (!db) return gate('Die Datenbank ist gerade nicht erreichbar.');
  S.db = db; S.user = user; S.assets = assets;
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(() => {});
  S.isOwner = !!(user && user.isOwner && user.isOwner());
  S.readonly = !S.isOwner && !!(user && user.can && user.can('data.write') === false);
  subscribeCfg();
  if (await verifySession()) { enterApp(S.uid, lsGet().token, S.sessHash, S.mustChange); return; }
  showAuth('login');
}
boot();
})();

</script>
